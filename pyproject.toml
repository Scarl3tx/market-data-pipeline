
[project]
name = "market-data-pipeline"
version = "0.1.0"
description = "Multi-provider market data ingestion and analytics pipeline."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Scarl3tx", email = "kahyuenyip@gmail.com" }
]
dependencies = [
    "boto3>=1.43.126",
    "botocore[crt]>=1.43.126",
    "duckdb>=2.0.0",
    "pandas>=3.1.0",
    "pandas-market-calendars>=5.6.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
market-data-pipeline = "market_data.main:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "market_data"
module-root = "src"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
